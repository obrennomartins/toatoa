services:
  api:
    build: .
    container_name: "toatoa-api"
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      ConnectionStrings__ORACLECONNSTR_ToAToaDb: ${ORACLECONNSTR_ToAToaDb}
      ReverseProxy__KnownProxies__0: ${REVERSE_PROXY_IP:-}
    volumes:
      - "${ORACLE_WALLET_PATH:-/opt/toatoa/wallet}:/app/wallet:ro"
